name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy parseru
        run: ./gradlew :app:testDebugUnitTest
      - name: Sestavení APK
        run: ./gradlew :app:assembleRelease
      - name: Verze
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - run: |
          cp app/build/outputs/apk/release/app-release.apk obchodsken.apk
          cp obchodsken.apk "obchodsken-${{ steps.ver.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: obchodsken-apk
          path: obchodsken.apk
      # Jen push na aktuální commit – opakované spuštění starého buildu nesmí přepsat novější APK.
      - name: Zveřejnit jako release "latest"
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Obchodsken (${{ github.ref_name }})
          prerelease: true
          body: "Verze ${{ steps.ver.outputs.name }} (commit ${{ github.sha }}). foods.jsonl = databáze potravin (formát data/foods/FORMAT.md)."
          files: |
            obchodsken.apk
            data/foods/foods.jsonl
            obchodsken-${{ steps.ver.outputs.name }}.apk
