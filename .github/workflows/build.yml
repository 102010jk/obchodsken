name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy parseru
        run: ./gradlew :app:testDebugUnitTest
      - name: Sestavení APK
        run: ./gradlew :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk obchodsken.apk
      - uses: actions/upload-artifact@v4
        with:
          name: obchodsken-apk
          path: obchodsken.apk
      - name: Zveřejnit jako release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Obchodsken (${{ github.ref_name }})
          prerelease: true
          files: obchodsken.apk
